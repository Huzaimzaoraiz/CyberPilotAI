version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyberdefense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyberdefense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberdefense"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cyberdefense-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cyberdefense
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  pgdata:
    driver: local
